version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: evolvs-ai-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend/app:/app/app
      - ./backend/data:/app/data
    networks:
      - evolvs-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: evolvs-ai-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://backend:8000/api
    depends_on:
      - backend
    networks:
      - evolvs-network

networks:
  evolvs-network:
    driver: bridge
